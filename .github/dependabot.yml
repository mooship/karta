version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # maplibre-gl@6+ rewrote worker loading to be ESM-only and silently
      # breaks vector basemaps on real iOS hardware with no thrown error
      # (maplibre/maplibre-gl-js#8002, unresolved upstream as of pinning).
      # Pinned to 5.x in packages/map/package.json + the root `overrides`
      # entry -- only lift this once that regression is confirmed fixed
      # upstream and re-verified on real iOS hardware, not just simulators.
      - dependency-name: "maplibre-gl"
        versions: [">=6.0.0"]
  - package-ecosystem: "npm"
    directory: "/data-pipeline"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
