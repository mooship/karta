version: 2
updates:
  # Security/crypto-relevant deps get a faster, separate weekly PR: the
  # Cloudflare deploy tool, the SSR framework, the build tool, and the
  # runtime GeoJSON validation boundary.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm-critical:
        patterns:
          - "*"
    allow:
      - dependency-name: "wrangler"
      - dependency-name: "vite"
      - dependency-name: "react-router"
      - dependency-name: "zod"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "wrangler"
      - dependency-name: "vite"
      - dependency-name: "react-router"
      - dependency-name: "zod"
      # maplibre-gl@6+ rewrote worker loading to be ESM-only and silently
      # breaks vector basemaps on real iOS hardware with no thrown error
      # (maplibre/maplibre-gl-js#8002, unresolved upstream as of pinning).
      # Pinned to 5.x in packages/map/package.json + the root `overrides`
      # entry -- only lift this once that regression is confirmed fixed
      # upstream and re-verified on real iOS hardware, not just simulators.
      - dependency-name: "maplibre-gl"
        versions: [">=6.0.0"]
  # data-pipeline parses zip/shapefile data fetched from external sources
  # (adm-zip, shapefile) -- kept on the faster critical tier too.
  - package-ecosystem: "npm"
    directory: "/data-pipeline"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm-data-pipeline-critical:
        patterns:
          - "*"
    allow:
      - dependency-name: "adm-zip"
      - dependency-name: "shapefile"
  - package-ecosystem: "npm"
    directory: "/data-pipeline"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm-data-pipeline:
        patterns:
          - "*"
    ignore:
      - dependency-name: "adm-zip"
      - dependency-name: "shapefile"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
