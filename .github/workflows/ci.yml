name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: cd data-pipeline && bun install --frozen-lockfile
      - run: cd data-pipeline && bun run cache:prune
      - name: Verify compiled Paraglide messages are up to date
        run: |
          bun run --filter @karta/web messages:compile
          git diff --exit-code -- packages/web/src/paraglide || {
            echo "::error::packages/web/src/paraglide is out of date. Run 'bun run --filter @karta/web messages:compile' and commit the result.";
            exit 1;
          }
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: cd data-pipeline && bun run validate
      - run: bun run build
