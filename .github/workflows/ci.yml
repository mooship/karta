name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            data-pipeline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir data-pipeline install --frozen-lockfile
      - run: pnpm --dir data-pipeline run cache:prune
      - name: Verify compiled Paraglide messages are up to date
        run: |
          pnpm --filter @karta/web run messages:compile
          git diff --exit-code -- packages/web/src/paraglide || {
            echo "::error::packages/web/src/paraglide is out of date. Run 'pnpm --filter @karta/web run messages:compile' and commit the result.";
            exit 1;
          }
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: pnpm --dir data-pipeline run validate
      - run: pnpm run build
