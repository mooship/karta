name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Opens/updates a "Version Packages" PR when unreleased changesets
      # exist on main; once that PR is merged, runs `publish-script` (which
      # only tags private packages -- see .changeset/config.json's
      # privatePackages and docs/releasing.md -- there is no npm publish)
      # and creates a GitHub Release per package from its changelog.
      - uses: changesets/action@v2.1.1
        with:
          version-script: npm run changeset:version
          publish-script: npm run changeset:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
